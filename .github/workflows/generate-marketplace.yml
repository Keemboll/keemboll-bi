name: Generate marketplace.json

# Triggered by the GitHub "push" webhook when a plugin changes:
# bumps the plugin version if it was not changed by hand, then regenerates marketplace.json.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/generate_marketplace.py"
      - "scripts/bump_versions.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-marketplace
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bump changed versions
        run: python scripts/bump_versions.py "${{ github.event.before }}" "${{ github.sha }}"
      - name: Generate marketplace.json
        run: python scripts/generate_marketplace.py
      - name: Validate
        run: python scripts/validate.py
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Commit if changed
        run: |
          if git diff --quiet -- .claude-plugin plugins; then
            echo "Versions and marketplace.json already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json
          git commit -m "chore: bump versions and regenerate marketplace.json [skip ci]"
          git push
